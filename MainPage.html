<!DOCTYPE html>
<html lang="en-US">
<head>
    <link rel="stylesheet" href="Style.css">
    <title>Mine Clicker</title>
</head>
<body>
    <button class="button", id="mainButton">Mine</button>
    
    <p id = "counter", class = "score"><bold>$0</bold></p>

    <table class = "shoptable">
        <tr id= "shop1">
            <td>Pickaxe</td>
            <td>$50</td>
            <td>0</td>
        </tr>
    </table>
    
    <p id="test"></p>
    <script>
        let counter = document.getElementById("counter");
        let button = document.getElementById("mainButton");
        let count = 0;
        let shop1 = document.getElementById("shop1");
        button.addEventListener("click", function() {
            count++;
            counter.innerHTML = "<bold>" + "$" + count + "</bold>";
        });
        button.addEventListener("mouseover", function() {
            button.style.backgroundColor = "#282524";
        });
        button.addEventListener("mouseout", function() {
            button.style.backgroundColor = "#3a3634";
        });
        
        shop1.style.backgroundColor = "#3a3634";
        shop1.addEventListener("mouseover", function() {
            shop1.style.backgroundColor = "#282524";
        });
        shop1.addEventListener("mouseout", function() {
            shop1.style.backgroundColor = "#3a3634";
        });
    </script>
</body>
